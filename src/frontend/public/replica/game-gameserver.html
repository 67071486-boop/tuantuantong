<style type="text/css">
    .layui-table-cell {
        height: 40px;
        line-height: 40px;
        padding: 0 5px;
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-sizing: border-box;
        font-size: 12px;
    }

    .lableb {
        display: inline-block;
        padding: 2px 4px;
        font-size: 12px;
        line-height: 14px;
        color: #fff;
        white-space: nowrap;
        vertical-align: middle;
        background-color: #999;
        overflow: hidden;
        border-radius: 3px;
        margin-right: 2px;
    }
</style>
<form class="layui-form" action="" onsubmit="return false">
    <div class="" style="">
        <table class="layui-hide" id="tableList" lay-filter="tableList"></table>
        <script type="text/html" id="switchTpl1">
            <input type="checkbox" name="sta" lay-skin="switch" lay-text="是|否" lay-filter="swicth1Checked">
        </script>
        <script type="text/html" id="switchTpl2">
            <input type="checkbox" name="loginVer" lay-skin="switch" lay-text="是|否" lay-filter="swicth2Checked">
        </script>
        <script type="text/html" id="switchTpl3">
            <input type="checkbox" name="warring" lay-skin="switch" lay-text="是|否" lay-filter="swicth3Checked">
        </script>
        <script type="text/html" id="switchTpl4">
            <input type="checkbox" name="warring" lay-skin="switch" lay-text="是|否" lay-filter="swicth4Checked">
        </script>
        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-xs" lay-event="refresh" type="button" title="刷新当前数据"><i class="layui-icon">&#xe669;</i>刷新游戏列表</button>
                <button class="layui-btn layui-btn-xs layui-btn-danger" style="margin-right:5px" lay-event="addGameBtn" type="button" title="新增一款游戏"><i class="layui-icon layui-jia"></i>新增一款游戏</button>
                <!-- ⚠️ **我方新增的第三颗按钮**（对标工具栏只有上面两颗）：删除改成软删除之后
                     （D-0085），得有个地方能看/恢复已删除的游戏；对标没有这个功能。
                     图标 `layui-icon-return` 是官方字形（对标那几个私有字形取不到码点）。 -->
                <button class="layui-btn layui-btn-xs" lay-event="deletedBtn" type="button" title="查看并恢复已删除的游戏"><i class="layui-icon layui-icon-return"></i>已删除</button>
            </div>
        </script>
        <script type="text/html" id="baroperating">
            <a class="layui-btn layui-btn-xs layui-btn-danger" style="margin-right:3px" lay-event="submitDel" title="删除该游戏"><i class="layui-icon layui-icon-delete"></i>删除游戏</a>
        </script>
    </div>

</form>
