        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - name: external_user_id
        in: path
        schema: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
        required: true
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
