      - {$ref: '#/components/parameters/OrderNumber'}
  /api/integration/v1/taker/orders/{order_no}/status/:
    post:
      summary: 打手交单、报告问题、暂停
      operationId: changeMyOrderStatus
      security:
      - TakerBearer: []
      responses:
        '200': {$ref: '#/components/responses/ClaimOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - PENDING_REVIEW
                  - ISSUE
                  - PAUSED
                remark: {type: string, maxLength: 255}
              required:
              - status
              additionalProperties: false
  /api/integration/v1/changes/:
    get:
      summary: 补拉已提交订单和打手变更
      operationId: listChanges
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListChangesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
        '410':
          description: 同步水位已过期。需要重建快照。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessError'}
      parameters:
      - name: cursor
        in: query
        schema: {type: string, maxLength: 512}
      - name: start
        in: query
        schema:
          type: string
          enum:
          - now
        description: 获取初始化水位。与 cursor 互斥。
      - name: page_size
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
webhooks:
  integrationChange:
    post:
      summary: 订单和打手变更回调
      operationId: onIntegrationChange
      parameters:
      - name: X-TT-Timestamp
        in: header
        schema: {type: integer}
        required: true
        description: 发送时间戳，单位为秒。
      - name: X-TT-Delivery
        in: header
        schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        required: true
      - name: X-TT-Signature
        in: header
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        required: true
      description: 使用应用密钥验签。先按原报文去除 sign 字段，递归按键排序并紧凑序列化，再对时间戳、投递编号和报文 SHA-256 十六进制摘要用换行连接后计算 HMAC-SHA256。使用 event_id
        去重。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeWebhook'}
      responses:
        2XX: {description: 回调已处理或者已持久化并等待处理。}
components:
  securitySchemes:
    AppBearer: {type: http, scheme: bearer, description: 工作室业务应用令牌}
    TakerBearer: {type: http, scheme: bearer, description: 绑定到打手的短期令牌}
  parameters:
    OrderNumber:
      name: order_no
      in: path
      schema: {$ref: '#/components/schemas/OrderNumber'}
      required: true
    TakerId:
      name: taker_id
      in: path
      schema: {type: integer, minimum: 1}
      required: true
    PageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, minLength: 8, maxLength: 128}
      required: true
      description: 相同操作重试时复用原键和请求体。
    Actor:
      name: X-TT-Actor
      in: header
      schema: {type: string, pattern: '^[A-Za-z0-9_.:@-]{1,64}$'}
      description: 从 Next.js 登录态取得的稳定运营用户编号。
  responses:
