openapi: 3.1.0
info: {title: 团团通工作室业务接口, version: 1.0.0, description: Next.js 服务端使用业务应用凭据。打手接口使用已绑定账号的短期令牌。}
servers:
- {url: 'https://studio.example.invalid', description: 替换为所接入的工作室域名。}
paths:
  /api/open/oauth/token:
    post:
      summary: 应用凭据换令牌
      operationId: exchangeAppToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: {const: client_credentials}
                client_id: {type: string}
                client_secret: {type: string}
              required:
              - grant_type
              - client_id
              - client_secret
              additionalProperties: false
      responses:
        '200':
          description: 应用令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
        '401':
          description: 换令牌失败。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  error_description: {type: string}
                required:
                - error
                - error_description
        '429':
          description: 换令牌失败。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  error_description: {type: string}
                required:
                - error
                - error_description
  /api/integration/v1/orders/:
    get:
      summary: 订单列表
      operationId: listOrders
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrdersResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
      - name: status
        in: query
        schema:
          type: string
          enum:
          - UNASSIGNED
          - WAITING_GRAB
          - IN_PROGRESS
          - PENDING_REVIEW
          - COMPLETED
          - ISSUE
          - PAUSED
          - REFUNDED
      - name: game_id
        in: query
        schema: {type: integer, minimum: 1}
      - name: taker_id
        in: query
        schema: {type: integer, minimum: 1}
      - name: source
        in: query
        schema: {type: string}
      - name: source_order_no
        in: query
        schema: {type: string}
      - name: created_from
        in: query
        schema: {type: string, format: date-time}
      - name: created_to
        in: query
        schema: {type: string, format: date-time}
      - name: updated_since
        in: query
        schema: {type: string, format: date-time}
      - name: after
        in: query
        schema: {type: string, pattern: '^([0-9]{20})?$'}
        description: 快照扫描首轮传空字符串，之后传上一页最后的订单号，每次取第 1 页。
    post:
      summary: 录单
      operationId: createOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
  /api/integration/v1/orders/assignees/:
    get:
      summary: 可派打手名单
      operationId: listAssignees
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListAssigneesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
      - name: game_id
        in: query
        schema: {type: integer, minimum: 1}
  /api/integration/v1/orders/recycle-bin/:
    get:
      summary: 订单回收站
      operationId: listDeletedOrders
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrdersResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
  /api/integration/v1/orders/{order_no}/:
    get:
      summary: 订单详情
      operationId: getOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
    patch:
      summary: 改单及调整订单报价
      operationId: updateOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderPatch'}
  /api/integration/v1/orders/{order_no}/status/:
    get:
      summary: 订单状态及时间
      operationId: getOrderTiming
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/GetOrderTimingResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
    post:
      summary: 变更订单状态
      operationId: changeOrderStatus
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - PENDING_REVIEW
                  - COMPLETED
                  - ISSUE
                  - PAUSED
                  - REFUNDED
                remark: {type: string, maxLength: 255}
              required:
              - status
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/assign-price/:
    put:
      summary: 改发单价
      operationId: changeHallPrice
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price: {type: string, pattern: '^-?[0-9]+(?:\.[0-9]{1,2})?$', example: '125.00'}
                reason: {type: string}
              required:
              - price
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/assign/:
    post:
      summary: 指派订单
      operationId: assignOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taker_id: {type: integer, minimum: 1}
                price: {type: string, pattern: '^-?[0-9]+(?:\.[0-9]{1,2})?$', example: '125.00'}
              required:
              - taker_id
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/reassign/:
    post:
      summary: 改派订单
      operationId: reassignOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taker_id: {type: integer, minimum: 1}
                price: {type: string, pattern: '^-?[0-9]+(?:\.[0-9]{1,2})?$', example: '125.00'}
              required:
              - taker_id
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/publish/:
    post:
      summary: 发到大厅
      operationId: publishOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/orders/{order_no}/withdraw/:
    post:
      summary: 撤回大厅订单
      operationId: withdrawOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/orders/{order_no}/clear-taker/:
    post:
      summary: 清除接手人
      operationId: clearOrderTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/orders/{order_no}/restore/:
    post:
      summary: 恢复订单
      operationId: restoreOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/orders/{order_no}/delete/:
    post:
      summary: 软删除订单
      operationId: deleteOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/orders/{order_no}/audit/:
    get:
      summary: 订单操作记录
      operationId: listOrderAudit
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrderAuditResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
  /api/integration/v1/orders/{order_no}/notes/:
    post:
      summary: 添加订单备注
      operationId: addOrderNote
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/AddOrderNoteResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: {type: string}
              required:
              - content
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/split/:
    post:
      summary: 本地拆单
      operationId: splitOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/SplitOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projects:
                  type: array
                  items: {type: string, minLength: 1, maxLength: 900}
                  minItems: 2
              required:
              - projects
              additionalProperties: false
  /api/integration/v1/orders/{order_no}/split-peer/:
    post:
      summary: 并列拆单
      operationId: splitPeerOrder
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/SplitPeerOrderResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PeerSplitOrder'}
  /api/integration/v1/orders/{order_no}/images/:
    get:
      summary: 读取进度图
      operationId: listOrderImages
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrderImagesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
    post:
      summary: 确认上传进度图
      operationId: claimOrderImage
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ClaimOrderImageResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageClaim'}
  /api/integration/v1/orders/{order_no}/images/ticket/:
    post:
      summary: 获取上传地址
      operationId: issueOrderImageTicket
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/IssueOrderImageTicketResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageTicketRequest'}
  /api/integration/v1/taker/orders/{order_no}/images/:
    get:
      summary: 读取进度图
      operationId: listOrderImagesAsTaker
      security:
      - TakerBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrderImagesAsTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
    post:
      summary: 确认上传进度图
      operationId: claimOrderImageAsTaker
      security:
      - TakerBearer: []
      responses:
        '200': {$ref: '#/components/responses/ClaimOrderImageResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageClaim'}
  /api/integration/v1/taker/orders/{order_no}/images/ticket/:
    post:
      summary: 获取上传地址
      operationId: issueOrderImageTicketAsTaker
      security:
      - TakerBearer: []
      responses:
        '200': {$ref: '#/components/responses/IssueOrderImageTicketResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageTicketRequest'}
  /api/integration/v1/orders/{order_no}/images/{image_id}/:
    delete:
      summary: 删除进度图
      operationId: deleteOrderImage
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/DeleteOrderImageResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/OrderNumber'}
      - name: image_id
        in: path
        schema: {type: integer, minimum: 1}
        required: true
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/takers/:
    get:
      summary: 打手列表
      operationId: listTakers
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListAssigneesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
      - name: q
        in: query
        schema: {type: string, maxLength: 64}
      - name: is_active
        in: query
        schema: {type: boolean}
      - name: include_deleted
        in: query
        schema: {type: boolean, default: false}
      - name: after
        in: query
        schema: {type: integer, minimum: 0}
        description: 快照扫描首轮传 0，之后传上一页最后的打手编号，每次取第 1 页。
    post:
      summary: 新增打手
      operationId: createTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TakerCreate'}
  /api/integration/v1/takers/{taker_id}/:
    get:
      summary: 打手详情
      operationId: getTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
    patch:
      summary: 编辑打手
      operationId: updateTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TakerPatch'}
  /api/integration/v1/takers/{taker_id}/enable/:
    post:
      summary: 启用打手
      operationId: enableTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/takers/{taker_id}/disable/:
    post:
      summary: 停用打手
      operationId: disableTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/takers/{taker_id}/delete/:
    post:
      summary: 软删除打手
      operationId: deleteTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/takers/{taker_id}/restore/:
    post:
      summary: 恢复打手
      operationId: restoreTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/CreateTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/TakerId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/Actor'}
  /api/integration/v1/catalog/games/:
    get:
      summary: 游戏字典
      operationId: listGames
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListGamesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
  /api/integration/v1/catalog/servers/:
    get:
      summary: 区服字典
      operationId: listServers
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListServersResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
      - name: game_id
        in: query
        schema: {type: integer, minimum: 1}
  /api/integration/v1/catalog/projects/:
    get:
      summary: 项目字典
      operationId: listProjects
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListProjectsResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
      - name: game_id
        in: query
        schema: {type: integer, minimum: 1}
        required: true
  /api/integration/v1/catalog/order-sources/:
    get:
      summary: 订单来源
      operationId: listOrderSources
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/ListOrderSourcesResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
      - {$ref: '#/components/parameters/PageNumber'}
      - {$ref: '#/components/parameters/PageSize'}
  /api/integration/v1/taker-bindings/{external_user_id}/:
    put:
      summary: 绑定 App 账号与团团通打手
      operationId: bindTaker
      security:
      - AppBearer: []
      responses:
        '200': {$ref: '#/components/responses/BindTakerResult'}
        default: {$ref: '#/components/responses/BusinessError'}
      parameters:
