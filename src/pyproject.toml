[project]
name = "tuantuantong"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-tenants==3.14.0",
    "psycopg[binary]>=3.2.1,<3.3",
    "django-environ>=0.11",
    "openpyxl>=3.1,<4",
    # 以下是 vendor 进 `src/jidanpu/` 的鸡蛋铺 SDK 的运行期依赖（决策 D3）：
    # 版本下限照抄上游 `jidanpuSDK/pyproject.toml` 的 dependencies，不要在这里收紧。
    "httpx>=0.27",
    "cryptography>=42,<51",
    "pydantic>=2.7",
    "gunicorn>=23,<24",
    # 图片存储线（2026-09-25）：腾讯云 COS 读写 / 签名 / 流式取。
    # 业务方已在 A6 的选择里确认（spec §12），不是「擅自定技术栈」。
    # ⚠️ 只有生产（`MEDIA_STORAGE_BACKEND=cos`）才会 import 它；本机/CI 的 local 模式
    #    不需要 —— 所以 `apps/core/storage.py` 里的 import 放在 `CosStorage` 内部。
    "cos-python-sdk-v5>=1.9.44",
    # 平台控制台的现代后台主题（platform-console 线 T3）。**新增运行时依赖**，
    # 已按 AGENTS §4 由业务方 2026-10-04 选定（spec §7-Q1 / 决策 D-0190）。
    # ⚠️ 只有**平台控制台进程**会渲染它：租户机上 `ROOT_URLCONF` 仍是 `config.urls`、
    # 从不挂 `/admin/`，所以租户机行为不变（spec §3.3 的「不扩散」保证）。
    # QQ 机器人线（2026-10-19 批次A）：WS 网关常驻进程（`qqbot_ws --loop`）用的
    # 同步 websocket 客户端。**新增运行时依赖**，已由业务方在 QQ 机器人线立项时确认。
    # ⚠️ 只有常驻 worker（`apps/qqbot/worker.py`）会 import 它；Web 请求路径不碰。
    "websocket-client>=1.8,<2",
    # 打手 App 充值二维码（2026-10-20，**业务方批准新增的两个运行时依赖**）：
    # App 是 uni-app x，`app/` 下没有 npm / canvas，前端纯库要人肉移植成 UTS（风险高）
    # ⇒ 改成后端出图。只有 `POST /api/app/wallet/deposit/` 的 `codeUrl` 分支用到
    # （`apps/accounts/qr.py`）；版本由 `uv add` 解析，⛔ 不手写。
    "qrcode>=8.2",
    "pillow>=13.0.0",
    # 企微自建应用（2026-11-11 业务方拍板钉死版本，升级走评审）：CPython 3.13 实测装成 +
    # 与生产 `apps/wechatmp/crypto.py` 互操作验证（证据：docs/plans/2026-11-11-wecom-selfbuilt-app.md 附录 A）。
    "wechatpy==2.0.0a26",
]

[project.optional-dependencies]
chat-pool = ["psycopg[pool]>=3.2.1,<3.3"]
