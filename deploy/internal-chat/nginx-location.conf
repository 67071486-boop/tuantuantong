# Include inside the HTTPS server of the pilot tenant.
location ^~ /internal-chat-webk/ {
    try_files $uri $uri/ =404;
    expires -1;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/wasm image/svg+xml;
    add_header Content-Security-Policy "frame-ancestors 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy same-origin always;

    location ~ "^/internal-chat-webk/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|wasm|svg|png|webp)$" {
        expires 365d;
    }
}

location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:4191;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
}
